services:
  nginx:
    image: nginx:stable-alpine
    container_name: barbershop-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php
      - mysql
    networks:
      - barbershop-network

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: barbershop-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: barbershop
      DB_USERNAME: barbershop
      DB_PASSWORD: secret
      APP_ENV: development
    depends_on:
      - mysql
    networks:
      - barbershop-network

  mysql:
    image: mysql:8.0
    container_name: barbershop-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: barbershop
      MYSQL_USER: barbershop
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    networks:
      - barbershop-network

  adminer:
    image: adminer
    container_name: barbershop-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - barbershop-network

volumes:
  db_data:

networks:
  barbershop-network:
    driver: bridge